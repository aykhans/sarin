version: "2"

run:
  go: "1.26"
  concurrency: 12

linters:
  default: none
  enable:
    - asciicheck
    - errcheck
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - reassign
    - staticcheck
    - unconvert
    - unused
    - whitespace
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - embeddedstructfieldcheck
    - errorlint
    - exptostd
    - fatcontext
    - funcorder
    - gocheckcompilerdirectives
    - gocritic
    - gomoddirectives
    - gosec
    - gosmopolitan
    - grouper
    - importas
    - inamedparam
    - intrange
    - loggercheck
    - mirror
    - musttag
    - perfsprint
    - predeclared
    - tagalign
    - tagliatelle
    - testifylint
    - thelper
    - tparallel
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign

  settings:
    errcheck:
      # Lip Gloss print helpers wrap fmt.Fprint* and fail only on unactionable
      # write errors (broken pipe, full disk). errcheck excludes the fmt
      # equivalents by default; these are excluded for the same reason.
      exclude-functions:
        - charm.land/lipgloss/v2.Print
        - charm.land/lipgloss/v2.Printf
        - charm.land/lipgloss/v2.Println
        - charm.land/lipgloss/v2.Fprint
        - charm.land/lipgloss/v2.Fprintf
        - charm.land/lipgloss/v2.Fprintln
    staticcheck:
      checks:
        - "all"
        - "-S1002"
        - "-ST1000"
    varnamelen:
      ignore-decls:
        - w http.ResponseWriter
        - wg sync.WaitGroup
        - wg *sync.WaitGroup

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - errorlint
          - forcetypeassert
          - perfsprint
          - errcheck
          - gosec

      - path: _test\.go$
        linters:
          - staticcheck
        text: "SA5011"

      # Counterpart to the errcheck exclusions above: gosec's G104 keeps its
      # own allowlist, which covers fmt but not the Lip Gloss print helpers.
      - linters:
          - gosec
        text: "G104"
        source: "lipgloss\\.(Print|Printf|Println|Fprint|Fprintf|Fprintln)\\("

formatters:
  enable:
    - gofmt

  settings:
    gofmt:
      # Simplify code: gofmt with `-s` option.
      # Default: true
      simplify: false
      # Apply the rewrite rules to the source before reformatting.
      # https://pkg.go.dev/cmd/gofmt
      # Default: []
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"
